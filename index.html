<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Settry</h1>

  <section id="menu">
    <div class="picker">
      <button id="prev-deck" aria-label="Previous deck">◀</button>
      <div id="deck-choice"></div>
      <button id="next-deck" aria-label="Next deck">▶</button>
    </div>
    <label class="seed">Seed <input id="seed" size="12" spellcheck="false"></label>
    <h3>Test jokers</h3>
    <p class="hint">Optional: start the run already holding up to 6 of these (your joker slots grow to fit). They apply left to right in the order picked.</p>
    <div id="joker-pick" class="joker-row"></div>
    <button id="start" class="big">Start game</button>
    <p><a href="gallery.html">See all cards</a> · <a href="jokers.html">See all jokers</a></p>
  </section>

  <section id="game" hidden>
    <div id="status"></div>
    <div class="held-row">
      <div id="jokers" class="joker-row small"></div>
      <div id="consumables" class="charm-row"></div>
    </div>

    <div id="choose-view" class="panel" hidden>
      <h2 id="choose-title"></h2>
      <div id="choices" class="offers"></div>
    </div>

    <div id="round-view" class="table">
      <div class="play-area">
        <div id="picked"></div>
        <div id="board"></div>
      </div>
      <aside>
        <div id="hand-box"></div>
        <p id="info"></p>
        <p id="msg"></p>
        <div class="actions">
          <button id="play">Play hand</button>
          <button id="discard">Discard</button>
          <button id="view-deck">View deck</button>
          <button id="menu-btn">Menu</button>
        </div>
      </aside>
    </div>

    <div id="cashout-view" class="panel" hidden>
      <h2>Fight won</h2>
      <div id="cashout-lines"></div>
      <button id="cash-out" class="big">Cash out</button>
    </div>

    <div id="shop-view" class="panel" hidden>
      <h2>Shop</h2>
      <p id="shop-note" class="prize"></p>
      <div id="shop-jokers" class="offers"></div>
      <div id="shop-packs" class="offers"></div>
      <div class="actions">
        <button id="reroll">Reroll</button>
        <button id="next-round" class="big">Next fight</button>
        <button id="view-deck-2">View deck</button>
      </div>
    </div>

    <div id="pack-view" class="panel" hidden>
      <h2 id="pack-title"></h2>
      <p id="pack-note" class="hint"></p>
      <div id="pack-options" class="offers"></div>
      <button id="skip-pack">Skip</button>
    </div>

    <div id="end-view" class="panel" hidden>
      <h2 id="end-title"></h2>
      <p id="end-text"></p>
      <button id="endless" class="big" hidden>Endless mode</button>
      <button id="end-menu" class="big">Back to menu</button>
    </div>
  </section>

  <dialog id="deck-dialog">
    <div class="dialog-head">
      <strong id="deck-title"></strong>
      <span>Sort by
        <button data-sort="color">Color</button>
        <button data-sort="count">Number</button>
        <button data-sort="shape">Shape</button>
        <button data-sort="shading">Shade</button>
      </span>
      <button id="close-deck">Close</button>
    </div>
    <p class="hint">Faded cards have been played or discarded. Outlined cards are on the board.</p>
    <div id="deck-list" class="gallery"></div>
  </dialog>

  <script src="data/config.js"></script>
  <script src="data/decks.js"></script>
  <script src="data/jokers.js"></script>
  <script src="data/modifiers.js"></script>
  <script src="data/hands.js"></script>
  <script src="data/fights.js"></script>
  <script src="data/consumables.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/jokers.js"></script>
  <script src="js/hands.js"></script>
  <script src="js/cards.js"></script>
  <script src="data/packs.js"></script>
  <script src="js/consumables.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
