<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settry cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>All cards</h1>
  <p id="info"></p>
  <div id="gallery" class="gallery"></div>
  <h2>Wild cards</h2>
  <p>Rows: wild suit, wild number, wild color, wild shading, then cards with two or more wilds.</p>
  <div id="wild" class="gallery"></div>
  <script src="data/config.js"></script>
  <script src="data/modifiers.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/cards.js"></script>
  <script>
    const cards = Deck.full();
    document.getElementById("info").textContent = `${cards.length} cards. Each row is one count and shape, in every shading and color.`;
    document.getElementById("gallery").innerHTML = cards
      .map((c) => `<div class="card" title="${c.id}">${cardSvg(c)}</div>`).join("");
    // A sample of each wild modification on assorted cards.
    const sample = (i) => cards[(i * 37 + 11) % cards.length];
    const rows = [["wildSuit"], ["wildCount"], ["wildColor"], ["wildShading"],
      ["wildSuit", "wildColor"], ["wildCount", "wildShading"], ["wildSuit", "wildCount", "wildColor", "wildShading"]];
    document.getElementById("wild").innerHTML = rows.flatMap((mods, r) =>
      Array.from({ length: 8 }, (_, i) => ({ ...sample(r * 8 + i), mods })))
      .map((c) => `<div class="card" title="${c.id} ${c.mods.join(" ")}">${cardSvg(c)}</div>`).join("");
  </script>
</body>
</html>
