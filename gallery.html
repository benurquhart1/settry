<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settry cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>All cards</h1>
  <p id="info"></p>
  <div id="gallery" class="gallery"></div>
  <h2>Wild suit</h2>
  <div id="wild" class="gallery"></div>
  <script src="data/config.js"></script>
  <script src="data/modifiers.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/cards.js"></script>
  <script>
    const cards = Deck.full();
    document.getElementById("info").textContent = `${cards.length} cards. Each row is one count and shape, in every shading and color.`;
    document.getElementById("gallery").innerHTML = cards
      .map((c) => `<div class="card" title="${c.id}">${cardSvg(c)}</div>`).join("");
    // One wild suit card per count, shading and color (shape doesn't matter once it's wild).
    document.getElementById("wild").innerHTML = cards
      .filter((c) => c.shape === "heart")
      .map((c) => ({ ...c, mods: ["wildSuit"] }))
      .map((c) => `<div class="card" title="${c.id} wild suit">${cardSvg(c)}</div>`).join("");
  </script>
</body>
</html>
